<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماس با من |محمدمهدی قاسمعلی</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="bg-dark text-white p-4">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark container">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <i class="fas fa-home me-2"></i>صفحه اصلی
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="about.html">درباره من</a></li>
                        <li class="nav-item"><a class="nav-link" href="hobbies.html">سرگرمی‌ها</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html">تماس با من</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <section class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <h1 class="fw-bold mb-4 text-center">تماس با من</h1>
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">نام:</label>
                        <input type="text" class="form-control" id="name" placeholder="نام خود را وارد کنید">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">ایمیل:</label>
                        <input type="email" class="form-control" id="email" placeholder="ایمیل خود را وارد کنید">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">پیام:</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="پیام خود را بنویسید"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" onclick="showSubmitAlert()">
                        <i class="fas fa-paper-plane me-2"></i>ارسال پیام
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© ۲۰۲۵ CS50x</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showSubmitAlert() {
            alert("پیام شما با موفقیت ارسال شد!");
        }
    </script>
</body>
</html>
